<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1b54"/>
      <stop offset="55%" stop-color="#172a4f"/>
      <stop offset="100%" stop-color="#0f4c5c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#56cfe1"/>
      <stop offset="100%" stop-color="#7ae582"/>
    </linearGradient>
    <linearGradient id="boltBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f48c06"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Twilight Sun & Distant Spire -->
  <circle cx="94" cy="36" r="18" fill="#ff9e00" opacity="0.35"/>
  <path d="M12 114 L38 68 L62 114 Z" fill="#3c2a6e" opacity="0.55"/>
  <!-- Gravity Orbit Ring -->
  <ellipse cx="64" cy="74" rx="48" ry="18" fill="none" stroke="url(#ring)" stroke-width="5" stroke-dasharray="12 6" transform="rotate(-18 64 74)"/>
  <!-- Energy Trail Sparkles -->
  <circle cx="28" cy="84" r="4" fill="#7ae582"/>
  <circle cx="40" cy="92" r="3" fill="#56cfe1"/>
  <circle cx="100" cy="54" r="3.5" fill="#ffd166"/>
  <!-- Leaping Bolt Character (Dynamic Action Pose) -->
  <g transform="translate(62, 56) rotate(-14)">
    <!-- Back Leg & Arm -->
    <path d="M-6 14 L-18 28 L-12 32" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-2 -2 L-18 -8" fill="none" stroke="#d97706" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Tail / Energy Plume -->
    <path d="M-10 12 Q-26 16 -30 6" fill="none" stroke="#56cfe1" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Torso -->
    <rect x="-11" y="-6" width="22" height="24" rx="10" fill="url(#boltBody)" stroke="#fff3b0" stroke-width="2"/>
    <!-- Chest Energy Core -->
    <circle cx="2" cy="5" r="5" fill="#56cfe1"/>
    <!-- Head & Ears -->
    <rect x="-12" y="-26" width="26" height="21" rx="9" fill="url(#boltBody)" stroke="#fff3b0" stroke-width="2"/>
    <polygon points="-10,-25 -15,-34 -3,-26" fill="#f48c06"/>
    <polygon points="8,-25 15,-34 3,-26" fill="#f48c06"/>
    <!-- Visor & Eyes -->
    <rect x="-6" y="-21" width="18" height="10" rx="5" fill="#1b263b"/>
    <circle cx="-1" cy="-16" r="2.3" fill="#7ae582"/>
    <circle cx="7" cy="-16" r="2.3" fill="#7ae582"/>
    <!-- Front Reaching Arm & Leaping Leg -->
    <path d="M8 -1 L24 -10" fill="none" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
    <circle cx="25" cy="-11" r="4" fill="#fff3b0"/>
    <path d="M6 14 L18 24 L25 20" fill="none" stroke="#ffd166" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
